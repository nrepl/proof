name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The oldest Go we support (keep in sync with go.mod) and the newest.
        go: ['1.23', stable]
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build for Windows
        run: GOOS=windows go build -o /dev/null ./cmd/proof

  # Runs the action the way a server's CI would, against Babashka. As this
  # isn't a release, the action builds proof from source. It's a test of
  # the action rather than of Babashka, so only the eval checks run, and new
  # checks Babashka fails don't break proof's CI.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          bb: '1.13.226'
      - uses: ./
        with:
          profile: babashka
          args: -v -only eval.*
