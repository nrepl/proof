# REPLy evaluates nothing for the namespace of the first prompt. When no
# reply has had an ns yet (e.g. the startup code failed), it then switches
# to user with another eval, which servers for other languages get.
[[checks.steps]]
send = { op = "eval", session = "$repl", code = "" }
refs = ["eval_modes/nrepl.clj#L118-L119"]
