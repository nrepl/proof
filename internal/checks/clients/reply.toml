# What REPLy 0.5.1, the version `lein repl` runs, sends while it starts.
# Leiningen only changes the help text in the startup code. REPLy
# evaluates the user's code with nothing but the code and its session,
# like eval.value, and files every reply that isn't output by its session,
# which wire.session-echo checks. The links point at the code that needs
# what the steps check.
name = "REPLy"
code = "https://github.com/trptcolin/reply/blob/2ee3e3a193e9df62d5dc965d25efd0521a289b70/src/clj/reply/"

# REPLy sends its startup code to any server, so this check runs on
# servers for other languages too.
[[checks]]
id = "reply.connect"
title = "REPLy can start"
why = "REPLy clones a session for the REPL and one for completion, and waits for an eval in the completion session, its startup code and an empty eval before it shows a prompt, so a server that gets any of it wrong leaves REPLy without a REPL."

[[checks.steps]]
send = { op = "clone" }
new-session = "repl"
why = "REPLy can't start"
refs = ["eval_modes/nrepl.clj#L203-L213"]

[[checks.steps]]
send = { op = "clone" }
new-session = "completion"
why = "REPLy can't start"
refs = ["eval_modes/nrepl.clj#L203-L213"]

# REPLy waits for the reply without a timeout. An error is fine, as REPLy
# then reads the value as nil, but a value read-string can't read stops
# it.
[[checks.steps]]
send = { op = "eval", session = "$completion", code = "(clojure.core/binding [clojure.core/*ns* (clojure.core/or (clojure.core/find-ns (clojure.core/symbol \"reply.eval-modes.nrepl\")) clojure.core/*ns*)] (set! *print-length* nil))" }
refs = ["eval_modes/nrepl.clj#L171-L182", "eval_modes/nrepl.clj#L228", "eval_modes/nrepl.clj#L59-L70"]

# The startup code, which REPLy waits for too. Errors are fine here as well.
[[checks.steps]]
refs = ["eval_modes/nrepl.clj#L229-L236", "initialization.clj#L113-L164", "eval_modes/nrepl.clj#L59-L70"]

[checks.steps.send]
