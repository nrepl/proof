# The reference implementation, nrepl/nrepl, on the Clojure CLI.
name = "Clojure (nrepl/nrepl 1.7.0)"
homepage = "https://github.com/nrepl/nrepl"

[launch]
command = ["clojure", "-Sdeps", "{:deps {nrepl/nrepl {:mvn/version \"1.7.0\"}}}", "-M", "-m", "nrepl.cmdline", "--port", "0"]
port-pattern = 'nREPL server started on port (\d+)'
startup-timeout = "120s"

[capabilities]
namespaces = true
clojure = true

[snippets.value]
code = "(+ 1 2)"
value = "3"

[snippets.stdout]
code = '(print "proof")'
out = "proof"

[snippets.stderr]
code = '(binding [*out* *err*] (print "proof"))'
err = "proof"

[snippets.throw]
code = '(throw (ex-info "proof" {}))'

[snippets.define]
code = "(def proof-answer 42)"
use = "proof-answer"
value = "42"

# Leaves session-local state behind (*1 is per session).
[snippets.session-state]
code = ":proof-marker"
use = "*1"
value = ":proof-marker"

[snippets.multiple]
code = "1 2"
values = ["1", "2"]

# Reads a line from stdin.
[snippets.read-line]
code = "(read-line)"
value = '"proof"'
eof = "nil"
