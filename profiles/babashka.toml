# babashka.nrepl, the server built into bb.
name = "Babashka"
homepage = "https://github.com/babashka/babashka.nrepl"

[launch]
command = ["bb", "nrepl-server", "localhost:0"]
port-pattern = 'Started nREPL server at [^:]+:(\d+)'
startup-timeout = "30s"

[capabilities]
namespaces = true
clojure = true

[snippets.value]
code = "(+ 1 2)"
value = "3"

[snippets.stdout]
code = '(print "proof")'
out = "proof"

[snippets.stderr]
code = '(binding [*out* *err*] (print "proof"))'
err = "proof"

[snippets.throw]
code = '(throw (ex-info "proof" {}))'

[snippets.define]
code = "(def proof-answer 42)"
use = "proof-answer"
value = "42"

# Leaves session-local state behind (*1 is per session).
[snippets.session-state]
code = ":proof-marker"
use = "*1"
value = ":proof-marker"

[snippets.multiple]
code = "1 2"
values = ["1", "2"]

# Reads a line from stdin.
[snippets.read-line]
code = "(read-line)"
value = '"proof"'
eof = "nil"
