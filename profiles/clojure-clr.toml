# clr.tools.nrepl on ClojureCLR, a port of babashka.nrepl. Needs cljr
# and Clojure.Main (which cljr hands off to) on PATH:
#
#   dotnet tool install -g Clojure.Main
#   dotnet tool install -g Clojure.Cljr --prerelease
#
# With .NET from Homebrew, also export
# DOTNET_ROOT=/opt/homebrew/opt/dotnet/libexec or cljr can't find the runtime.
name = "ClojureCLR (clr.tools.nrepl 0.1.2-alpha2)"
homepage = "https://github.com/clojure/clr.tools.nrepl"

[launch]
command = ["cljr", "-Sdeps", "{:deps {io.github.clojure/clr.tools.nrepl {:git/tag \"v0.1.2-alpha2\" :git/sha \"a58009f\"}}}", "-M", "-e", "(require 'clojure.tools.nrepl) (clojure.tools.nrepl/start-server! {:host \"localhost\" :port 0})"]
# The address can be IPv6 (::1), so anchor on the last colon.
port-pattern = 'Started nREPL server at .*:(\d+)\s*$'
# The first run clones the dependencies.
startup-timeout = "180s"

[capabilities]
namespaces = true

[snippets.value]
code = "(+ 1 2)"
value = "3"

[snippets.stdout]
code = '(print "proof")'
out = "proof"

[snippets.stderr]
code = '(binding [*out* *err*] (print "proof"))'
err = "proof"

[snippets.throw]
code = '(throw (ex-info "proof" {}))'

[snippets.define]
code = "(def proof-answer 42)"
use = "proof-answer"
value = "42"

# Leaves session-local state behind (*1 is per session).
[snippets.session-state]
code = ":proof-marker"
use = "*1"
value = ":proof-marker"

[snippets.multiple]
code = "1 2"
values = ["1", "2"]

# Reads a line from stdin.
[snippets.read-line]
code = "(read-line)"
value = '"proof"'
eof = "nil"
